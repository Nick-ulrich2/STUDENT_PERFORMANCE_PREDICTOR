name: Keep API awake

# Render's free tier puts the API to sleep after ~15 minutes without a request;
# the next visitor then waits 30-60 s ("Le serveur se réveille"). Pinging every
# 10 minutes keeps it warm. GitHub's scheduler is best-effort (runs can be
# delayed by several minutes), so a second free pinger such as cron-job.org or
# UptimeRobot on the same URL is a good complement.
# Required repository secret: API_URL (e.g. https://<your-service>.onrender.com).

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the API
        env:
          API_URL: ${{ secrets.API_URL }}
        run: |
          if [ -z "$API_URL" ]; then echo "API_URL not set: skipping"; exit 0; fi
          curl -s -o /dev/null -w "API answered %{http_code} in %{time_total}s\n" --max-time 120 "${API_URL%/}/"
