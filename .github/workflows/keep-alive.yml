name: Keep alive

# Free tiers sleep: Supabase pauses a project after 7 days without activity
# (the database then disappears from DNS until it is restored by hand) and
# Render puts the API to sleep after ~15 minutes. This workflow sends a light
# request to both so a demo never starts on a dead stack.
# Required repository secrets: SUPABASE_URL, SUPABASE_ANON_KEY, API_URL.

on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (REST, counts as project activity)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Supabase secrets not set: skipping"; exit 0
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 \
            "$SUPABASE_URL/rest/v1/model_versions?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "Supabase REST answered $code"
          case "$code" in 2*|401|403) exit 0 ;; *) exit 1 ;; esac
      - name: Wake the API
        env:
          API_URL: ${{ secrets.API_URL }}
        run: |
          if [ -z "$API_URL" ]; then echo "API_URL not set: skipping"; exit 0; fi
          curl -s -o /dev/null -w "API answered %{http_code} in %{time_total}s\n" --max-time 120 "$API_URL/docs"
